function mark(path=''){dirty=true;version++;if(a()){a().updated=now();if(!['decision.record','decision.checkpoint'].includes(path)&&a().decision.recordedAt)a().decision.needsReview=true;}$('save-status').textContent='Unsaved changes';clearTimeout(timer);timer=setTimeout(save,650);}
async function save(){clearTimeout(timer);if(blocked)return false;if(saving){await saving;if(dirty&&!blocked)return save();return !dirty;}if(!dirty)return true;if(!store){$('save-status').textContent='Not saved · use Back up';return false;}const start=version,payload=clone(workspace),expected=workspace.revision;$('save-status').textContent='Saving…';saving=(async()=>{try{const rev=await store.save(payload,expected);workspace.revision=rev;if(version===start)dirty=false;$('save-status').textContent=dirty?'Unsaved changes':'Saved · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return true;}catch(e){if(e.name==='ConflictError')blocked=true;$('save-status').textContent='Not saved · export to keep edits';alertMessage(e.message);return false;}finally{saving=null;}})();const ok=await saving;if(dirty&&ok&&!blocked)timer=setTimeout(save,150);return ok;}
function nav(){const active=a();$('switcher').innerHTML=`<div class="field"><label for="assessment-switch">Current assessment</label><select id="assessment-switch">${workspace.assessments.map(x=>`<option value="${esc(x.id)}" ${x.id===currentId?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>`;$('navigation').innerHTML=pages.map(([id,label],i)=>`<button type="button" data-page="${id}" ${id===page?'aria-current="page"':''}><span class="number" aria-hidden="true">${String(i).padStart(2,'0')}</span>${label}</button>`).join('');$('storage-label').textContent=store?.label||'Temporary session · export to keep work';document.title=`${active?.title||'Assessments'} — Bowtie Workbench`;}
function render(focus=false){const prior=document.activeElement?.id;for(const d of main.querySelectorAll('details')){if(d.open)openDetails.add(d.id);else openDetails.delete(d.id);}if(!a()&&page!=='home'&&page!=='guide')page='home';nav();const renderers={home:homePage,scope:scopePage,bowtie:bowtiePage,chains:chainsPage,outcomes:outcomesPage,decision:decisionPage,learning:learningPage,report:reportPage,guide:guidePage};main.innerHTML=renderers[page]();if(focus){main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}else if(prior&&$(prior))$(prior).focus({preventScroll:true});if(page==='bowtie'&&view==='map')requestAnimationFrame(drawConnectors);}
function homePage(){return head('A living record','Make uncertainty discussable.','Create an assessment, trace its pathways, and return to it as evidence changes.',button('New assessment','new','','primary')+button('Add example','sample'))+`<div class="panel soft"><h2>Pick up where you left off</h2><p>Drafts save automatically. Checkpoints preserve review history. Copies and templates clear old acceptance decisions and verification claims.</p><div class="actions"><div class="field"><label for="import-file">Import a backup (JSON)</label><input id="import-file" type="file" accept="application/json,.json"></div><span class="small muted">Import adds copies; existing assessments stay in place.</span></div></div><div class="cards">${workspace.assessments.slice().sort((p,q)=>Number(!!p.archived)-Number(!!q.archived)).map(x=>`<article class="panel"><div class="entity-head"><h2>${esc(x.title)}</h2>${badge(x.kind==='template'?'Template':'Assessment')}</div><p class="muted">${esc(x.objective||'Start by defining the objective and the situation.')}</p><div class="meta"><span>${x.threats.length} threats · ${x.consequences.length} consequences</span><span>${x.barriers.length} controls</span></div><p class="small">${x.reviewDate?`Review: ${esc(x.reviewDate)} ${overdue(x.reviewDate)?badge('Overdue','review'):''}`:'Review date not set'}</p><div class="actions">${button('Open assessment','open',x.id,'primary')}${button('Make a copy','copy',x.id)}${button('Make a template','template',x.id)}${button(x.archived?'Restore from archive':'Archive','archive',x.id)}${x.archived?button('Export archived assessment','export-id',x.id)+button('Permanently remove','delete-assessment',x.id):''}</div>${x.archived?'<p class="small">Archived — retained in backups and available for reference.</p>':''}</article>`).join('')}</div>`+notice('Browser storage belongs to this browser and device. Clearing site data can remove it. Keep portable backups; use the LMDB edition for a durable local database.','');}
function scopePage(){return head('01 / Define the situation','Scope & objectives','Describe what matters before estimating what might happen.')+`<section class="panel"><div class="grid">${field('Assessment name','title')}${field('Accountable owner','owner')}${field('Objective: what should this achieve?','objective',{type:'textarea'})}${field('Scope, context and exclusions','scope',{type:'textarea'})}${field('Hazard: what has the potential to cause harm?','hazard',{type:'textarea',help:'A source, activity or situation with harmful potential. This is distinct from both the event and its consequences.'})}${field('Top event: when is control lost?','topEvent',{type:'textarea',help:'State one observable loss of control. For example, a service becomes unavailable beyond its recovery time.'})}${field('Assessment horizon','horizon',{help:'For example, next 12 months or the three-day activity.'})}${field('Next review date','reviewDate',{type:'date'})}${field('People, living systems and assets affected','stakeholders',{type:'textarea',help:'Include indirect exposure, access needs, unequal burdens and who helped assess them.'})}${field('Assumptions and evidence gaps','assumptions',{type:'textarea'})}${field('Alternatives, including not proceeding','alternatives',{type:'textarea'})}${field('System boundaries and external dependencies','boundaries',{type:'textarea'})}</div></section><div class="actions">${button('Build the bowtie','page','bowtie','primary')}</div>`;}
function stateBadge(b){const s=barrierState(b);return badge(s==='verified'?'Verified & current':s==='unknown'?'Not verified':s[0].toUpperCase()+s.slice(1),s==='verified'?'within':s==='failed'?'stop':'review');}
function barrierMini(b){return `${button(b.label,'barrier',b.id)}<div>${stateBadge(b)} ${b.critical?badge('Critical','review'):''}</div>${b.escalations.map(e=>`<div class="factor-mini"><strong>Degradation:</strong> ${esc(e.factor||'Describe what weakens this control.')}<br><strong>Protection:</strong> ${esc(e.control||'Not specified')}<br>${badge(statusLabels[e.status]||e.status,e.status==='verified'?'within':'review')}</div>`).join('')}`;}
function bowtieMap(){const x=a();const wing=(items,side)=>items.map(t=>{const bs=x.barriers.filter(b=>b.side===side&&b.links.includes(t.id));return `<article class="pathway ${side==='recovery'?'right':''}" data-path-node="${esc(t.id)}"><div class="path-title">${esc(t.label)}</div><div class="direction">${side==='prevention'?'Threat → prevention → top event':'Top event → mitigation / recovery → consequence'}</div><div class="path-controls">${bs.map(barrierMini).join('')||'<p class="small">No linked control — a pathway gap.</p>'}</div></article>`;}).join('');return `<div class="map-headings"><div>Threats & prevention</div><div>Loss of control</div><div>Consequences & recovery</div></div><div class="bowtie" id="bowtie-map"><svg class="flow-connectors" aria-hidden="true"></svg><div class="wing left-wing">${wing(x.threats,'prevention')||'<p>Add a threat to begin.</p>'}</div><div class="central" id="top-node"><p class="eyebrow">Hazard</p><p class="small">${esc(x.hazard||'Not defined')}</p><hr class="divider"><p class="eyebrow">Top event</p><p class="top-event">${esc(x.topEvent||'Define the loss of control')}</p></div><div class="wing right-wing">${wing(x.consequences,'recovery')||'<p>Add a consequence to begin.</p>'}</div></div>`;}
function bowtieText(){const x=a();return `<div class="panel"><h2>${esc(x.topEvent||'Top event not defined')}</h2><p><strong>Hazard:</strong> ${esc(x.hazard)}</p>${[['Threat pathways',x.threats,'prevention'],['Consequence pathways',x.consequences,'recovery']].map(([title,items,side])=>`<h3>${title}</h3><ol>${items.map(t=>`<li><strong>${esc(t.label)}</strong><p>${esc(t.mechanism||t.cascade||'')}</p><p class="small">${side==='prevention'?'This threat can lead to the top event; linked controls act before loss of control.':'Following the top event, this consequence may occur; linked controls limit harm or enable recovery.'}</p><ul>${x.barriers.filter(b=>b.side===side&&b.links.includes(t.id)).map(b=>`<li>${barrierMini(b)}</li>`).join('')||'<li>No linked control.</li>'}</ul></li>`).join('')}</ol>`).join('')}</div>`;}
function bowtiePage(){const x=a();return head('02 / Map loss of control','A full bowtie','Select a control to inspect its evidence and the conditions that can defeat it.')+`<div class="actions no-print">${button('Diagram view','view','map',view==='map'?'primary':'')}${button('Text pathways','view','text',view==='text'?'primary':'')}${button('Add threat','add','threat')}${button('Add consequence','add','consequence')}${button('Add preventive control','add','prevention')}${button('Add recovery control','add','recovery')}</div>${view==='map'?bowtieMap():bowtieText()}${notice('Connections show causal pathways, not a calculation. A planned or unverified control is not credited automatically. An unlinked threat or consequence remains a visible gap.')}<h2>Edit pathways</h2>${x.threats.map((t,i)=>details('threat-'+t.id,t.label,`<div class="grid">${field('Threat','threats.'+i+'.label')}${field('Causal role','threats.'+i+'.context',{options:['Direct cause','Indirect contributor','Systemic condition','Latent condition']})}${field('How could it cause the top event?','threats.'+i+'.mechanism',{type:'textarea'})}${field('Conditions and assumptions','threats.'+i+'.assumptions',{type:'textarea'})}</div><div class="actions">${button('Remove threat','remove','threats.'+i)}</div>`)).join('')}<h2>Control register</h2>${x.barriers.map((b,i)=>barrierEditor(b,i)).join('')||'<p>No controls yet. Add one above and link it to a pathway.</p>'}`;}
function barrierEditor(b,i){const p='barriers.'+i;return details('barrier-'+b.id,b.label,`<div class="grid">${field('Control name',p+'.label')}${field('Accountable owner',p+'.owner')}${field('Declared status',p+'.status',{options:statuses,help:'Verified status needs an owner, performance standard, test, evidence and current dates.'})}${field('Design approach',p+'.type',{options:['Elimination','Substitution','Engineering / design','Detection & response','Administrative / procedure','Personal protection','Recovery & restoration']})}${field('What does this control actually do?',p+'.mechanism',{type:'textarea'})}${field('Performance standard',p+'.standard',{type:'textarea',help:'State the required function, capacity, reliability and response time where relevant.'})}${field('Verification method',p+'.test',{type:'textarea'})}${field('Evidence and provenance',p+'.evidence',{type:'textarea',help:'Record observations, test result references, scope and limitations; avoid unsupported assurance labels.'})}${field('Last verified',p+'.lastTest',{type:'date'})}${field('Next verification due',p+'.due',{type:'date'})}${field('Dependencies and common-cause failures',p+'.dependencies',{type:'textarea',help:'Shared people, power, data, software or suppliers may defeat several controls together.'})}${field('Costs, burden and harms introduced by the control',p+'.sideEffects',{type:'textarea'})}</div>${check('Critical control: failure requires escalation',p+'.critical')}${checks(b.side==='prevention'?'Threats this control addresses':'Consequences this control addresses',p+'.links',(b.side==='prevention'?a().threats:a().consequences).map(x=>[x.id,x.label]))}<h3 class="mt">What can weaken this control?</h3>${b.escalations.map((e,j)=>{const q=p+'.escalations.'+j;return details('factor-'+e.id,e.factor||'Escalation factor',`<div class="grid">${field('Specific degradation mechanism',q+'.factor',{type:'textarea'})}${field('Control protecting against that mechanism',q+'.control',{type:'textarea'})}${field('Protection owner',q+'.owner')}${field('Protection status',q+'.status',{options:statuses})}${field('Protection performance standard',q+'.standard',{type:'textarea'})}${field('Protection evidence',q+'.evidence',{type:'textarea'})}</div><div class="actions">${button('Remove factor','remove',q)}</div>`);}).join('')}<div class="actions">${button('Add escalation factor','factor',i)}${button('Open learning action','learn-barrier',b.id)}${button('Remove control','remove',p)}</div>`,stateBadge(b));}
function drawConnectors(){const map=$('bowtie-map'),top=$('top-node');if(!map||!top||getComputedStyle(map.querySelector('svg')).display==='none')return;const rect=map.getBoundingClientRect(),tr=top.getBoundingClientRect();let paths='';for(const el of map.querySelectorAll('.pathway')){const r=el.getBoundingClientRect(),right=el.classList.contains('right'),x1=(right?tr.right:r.right)-rect.left,y1=(right?tr.top+tr.height/2:r.top+r.height/2)-rect.top,x2=(right?r.left:tr.left)-rect.left,y2=(right?r.top+r.height/2:tr.top+tr.height/2)-rect.top;paths+=`<path d="M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}"/>`;}map.querySelector('svg').innerHTML=paths;}
function chainsPage(){const x=a(),nodes=chainNodes(x);return head('03 / Trace propagation','Event chains','Describe the conditions under which an event propagates, combines with another, or feeds back.',button('Add intermediate event','add','event')+button('Add causal link','add','link'))+notice('A link means a declared causal claim, not automatic certainty. AND/OR gates describe conditions; probabilities are not multiplied. Shared dependencies and feedback need explicit evidence and timing.')+(chainWarnings(x).length?notice(chainWarnings(x).join(' '),'warn'):'')+`<h2>Connected pathways</h2>${x.chainLinks.map(l=>{const from=nodes.find(n=>n.id===l.from),to=nodes.find(n=>n.id===l.to);return `<article class="panel"><div class="chain"><div class="chain-node"><span class="eyebrow">${esc(from?.kind||'Source')}</span><h3>${esc(from?.label||'Choose source')}</h3></div><div class="chain-link">${esc(l.type.replaceAll('_',' '))}<svg viewBox="0 0 100 15" aria-hidden="true"><path d="M0 7h95m-7-5 7 5-7 5"/></svg>${esc(l.lag||'Timing unknown')}</div><div class="chain-node"><span class="eyebrow">${esc(to?.kind||'Destination')}</span><h3>${esc(to?.label||'Choose destination')}</h3></div></div><p class="small small-gap"><strong>Condition:</strong> ${esc(l.condition||'Not yet specified')}</p></article>`;}).join('')||'<p>No causal links yet. Add the events and conditions you can substantiate.</p>'}<h2>Intermediate events and gates</h2>${x.events.map((e,i)=>{const p='events.'+i;return details('event-'+e.id,e.label,`<div class="grid">${field('Event',p+'.label')}${field('Incoming condition logic',p+'.gate',{options:[['unspecified','Not established'],['any','OR — any specified input is sufficient'],['all','AND — all specified inputs are required']]})}${field('Gate definition and external conditions',p+'.condition',{type:'textarea',help:'Name every required condition, including inputs outside this graph. Do not imply independence.'})}${field('Owner',p+'.owner')}</div><div class="actions">${button('Remove event','remove',p)}</div>`);}).join('')}<h2>Edit causal links</h2>${x.chainLinks.map((l,i)=>{const p='chainLinks.'+i;return details('link-'+l.id,`${nodes.find(n=>n.id===l.from)?.label||'Source'} → ${nodes.find(n=>n.id===l.to)?.label||'Destination'}`,`<div class="grid">${field('From',p+'.from',{options:[['','Choose source'],...nodes.map(n=>[n.id,n.kind+': '+n.label])]})}${field('To',p+'.to',{options:[['','Choose destination'],...nodes.map(n=>[n.id,n.kind+': '+n.label])]})}${field('Relationship',p+'.type',{options:[['contributes','Contributes to'],['required','Required input'],['inhibits','Inhibits'],['shared_dependency','Shared dependency / common cause'],['feedback','Feedback to an earlier event']]})}${field('Delay, duration or ordering',p+'.lag')}${field('Trigger or propagation condition',p+'.condition',{type:'textarea'})}${field('Causal evidence and alternatives',p+'.evidence',{type:'textarea'})}${field('Confidence in this link',p+'.confidence',{options:confidence})}</div><div class="actions">${button('Remove link','remove',p)}</div>`);}).join('')}`;}
function estimateEditor(c,i,stage,title){const p=`consequences.${i}.${stage}`;return `<fieldset><legend>${title}</legend>${field(a().basis==='frequency'?'Frequency band':'Probability band',p+'.likelihood',{options:[['','Unknown'],...a().likelihoodLabels.map((s,i)=>[i+1,s])]})}${field('Severity of this consequence',p+'.severity',{help:'Use the highest warranted severity across the assigned domains, or split outcomes when their profiles differ.',options:[['','Unknown'],...[1,2,3,4,5].map(s=>[s,`S${s} — use domain-specific anchors`])]})}${field('Range, uncertainty and scenario variants',p+'.range',{type:'textarea',help:'Preserve credible variation and upper-tail outcomes. Split materially different outcomes into separate scenarios.'})}${field('Evidence and assumptions for this estimate',p+'.evidence',{type:'textarea'})}${field('Confidence',p+'.confidence',{options:confidence})}</fieldset>`;}
function outcomesPage(){const x=a();return head('04 / Examine consequences','Harm & opportunity','Keep the distribution of harms and benefits visible. Neither cancels the other.',button('Add consequence','add','consequence')+button('Add opportunity','add','opportunity'))+`<div class="panel soft"><h2>Cover the whole field</h2><p>Fourteen starter harm domains cover people, rights, information, organisations, communities, living systems and future effects. They overlap deliberately. Add context-specific domains and explain exclusions; no generic list proves completeness.</p><div class="actions">${button('Review harm-domain coverage','page','decision')}</div></div><h2>Downside consequences</h2>${x.consequences.map((c,i)=>{const p='consequences.'+i,r=assess(x,c);return details('consequence-'+c.id,c.label,`<div class="grid">${field('Concrete harmful outcome',p+'.label')}${field('People or systems bearing the harm',p+'.groups')}${field('Pathway character',p+'.path',{options:['direct','indirect','systemic','cumulative','latent']})}${field('Reversibility',p+'.reversibility',{options:[['unknown','Unknown'],['reversible','Reversible with support'],['partial','Partly reversible'],['irreversible','Irreversible']]})}${field('Onset or latency',p+'.onset')}${field('Duration and repeated exposure',p+'.duration')}${field('Cascades and second-order consequences',p+'.cascade',{type:'textarea'})}${field('Linked assessment or external pathway',p+'.linkedAssessment')}${field('Severe tail, unequal burdens and affected minorities',p+'.tail',{type:'textarea'})}${field('Mandatory constraints / rights / duties',p+'.obligation',{options:[['unknown','Not checked'],['clear','Reviewed — no declared breach'],['breach','A declared constraint is breached']]})}</div>${checks('Applicable harm domains',p+'.categories',x.categories.map(z=>[z.id,z.label]))}<div class="notice"><strong>Residual comparison:</strong> ${badge(r.label,r.code)}<p class="small">${esc(r.reason)}</p></div><div class="rating-grid">${estimateEditor(c,i,'inherent','Inherent — declared baseline')}${estimateEditor(c,i,'residual','Residual — controls as they are')}${estimateEditor(c,i,'target','Target — proposed future state')}</div><p class="help">For inherent risk, state the precise baseline in the estimate evidence. Target risk remains a forecast until implemented controls are verified. Rate the consequence’s occurrence, not merely the top event.</p><div class="actions">${button('Remove consequence','remove',p)}</div>`,badge(r.label,r.code));}).join('')||'<p>Add a concrete consequence before choosing harm domains or severity.</p>'}<h2>Upside opportunities</h2>${x.opportunities.map((o,i)=>{const p='opportunities.'+i;return details('opportunity-'+o.id,o.label,`<div class="grid">${field('Opportunity',p+'.label')}${field('Accountable benefit owner',p+'.owner')}${field('Favourable drivers or conditions',p+'.drivers',{type:'textarea'})}${field('Opportunity event: what must become true?',p+'.event',{type:'textarea'})}${field('Enabling and realisation actions',p+'.enablers',{type:'textarea'})}${field('Benefit if realised',p+'.benefit',{type:'textarea'})}${field('Who benefits, and who might be excluded?',p+'.beneficiaries',{type:'textarea'})}${field('Chance or frequency, horizon and uncertainty',p+'.probability',{type:'textarea'})}${field('Benefit magnitude, units and distribution',p+'.magnitude',{type:'textarea'})}${field('Cost, effort, opportunity cost and downside introduced',p+'.cost',{type:'textarea'})}${field('Guardrails and stop conditions',p+'.guardrails',{type:'textarea'})}${field('Benefit measure and baseline',p+'.measure',{type:'textarea'})}${field('Evidence and dependencies',p+'.evidence',{type:'textarea'})}${field('Confidence in the opportunity',p+'.confidence',{options:confidence})}${field('Benefit review date',p+'.review',{type:'date'})}${field('Observed benefit and unintended effects',p+'.realised',{type:'textarea'})}</div>${checks('Downside scenarios linked to this opportunity',p+'.linkedHarms',x.consequences.map(c=>[c.id,c.label]))}<div class="actions">${button('Remove opportunity','remove',p)}</div>`);}).join('')}<p class="help expert">The opportunity path is an explicit extension of the conventional harm bowtie: favourable conditions → opportunity event → realised benefit, with enablers, benefit owners and downside guardrails.</p>`;}
function matrix(cat){if(!cat)return '';const assigned=a().consequences.filter(c=>c.categories.includes(cat.id)&&c.residual.likelihood&&c.residual.severity);return `<div class="matrix" role="img" aria-label="Declared appetite map for ${esc(cat.label)}. Rows are likelihood bands L5 to L1. Columns are severity bands S1 to S5. A tick means allowed by this domain's configured limit, cross means above it, question mark means not set. Exact limits are editable below."><div></div>${[1,2,3,4,5].map(s=>`<div class="axis">S${s}</div>`).join('')}${[5,4,3,2,1].map(l=>`<div class="axis">L${l}</div>${[1,2,3,4,5].map(s=>{const max=cat.limits[s-1],code=max===null?'unknown':l<=max?'within':'stop';return `<div class="cell ${code} ${assigned.some(c=>c.residual.likelihood===l&&c.residual.severity===s)?'selected':''}">${code==='unknown'?'?':code==='within'?'✓':'×'}<span class="word"> ${code==='unknown'?'Unset':code==='within'?'Fits':'Above'}</span></div>`;}).join('')}`).join('')}</div><div class="matrix-legend"><span>✓ Fits this domain’s limit</span><span>× Above limit</span><span>? Not set</span><span>Outlined cells: residual estimates</span></div><p class="help">This is a decision map, not a heat score. Overall comparison uses every assigned domain and its most restrictive applicable limit.</p>`;}
function decisionPage(){const x=a();const cat=x.categories.find(c=>c.id===matrixCategory)||x.categories[0];const problems=issues(x);return head('05 / Establish decision rules','Appetite & decision','Set the criteria before acceptance. Keep willingness, limits and actual capacity distinct.')+`<section class="panel"><h2>Decision position</h2>${x.consequences.map(c=>{const r=assess(x,c);return `<div class="review-row"><strong>${esc(c.label)}</strong>${badge(r.label,r.code)}</div>`;}).join('')||'<p>No consequences assessed.</p>'}${problems.length?details('readiness','Items needing attention',`<ul>${problems.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`,badge(String(problems.length),'review')):notice('No structural checklist gaps detected. This does not establish that the model is complete.')}<p class="help">A domain limit of “No acceptance” is a hard stop at that severity, regardless of benefit. Missing criteria or uncertainty never default to acceptance.</p></section><section class="panel"><h2>Frequency or probability — define the denominator</h2><div class="grid">${field('Likelihood basis','basis',{options:[['frequency','Frequency — expected event count per exposure'],['probability','Probability — chance of at least one event']]})}${field('Unit / exposure denominator','unit',{help:'For example, per operating year, per 1,000 tasks, or per defined mission. Probability also needs the assessment horizon.'})}${x.likelihoodLabels.map((s,i)=>field('L'+(i+1)+' — definition','likelihoodLabels.'+i)).join('')}</div><p class="help expert">Frequency can exceed one event per period. Probability lies between 0 and 1 (or 0–100%). They are not interchangeable. Conversion would require an event-process model; none is assumed here.</p></section><section class="panel"><h2>Appetite, tolerance and capacity</h2><div class="grid">${field('Risk appetite: what uncertainty are we willing to take, and why?','appetiteStatement',{type:'textarea'})}${field('Risk capacity: what loss or disruption can actually be absorbed?','capacity',{type:'textarea'})}${field('Non-negotiable constraints and obligations','constraints',{type:'textarea'})}${field('Tolerance thresholds, warning signals and escalation triggers','triggers',{type:'textarea'})}${field('Criteria owner / authority','policyOwner')}${field('Criteria confirmed on','policyDate',{type:'date'})}</div>${check('I have calibrated these definitions, rechecked all band assignments and confirmed the criteria for this scope','calibration')}<p class="help">Changing a scale, limit or basis clears this confirmation. “Within appetite” describes a comparison; it does not discharge duties or provide permission.</p></section><h2>Harm coverage and domain-specific limits</h2><p class="muted">Use concrete severity anchors for each domain. Do not add or average ordinal severity levels across people or harm types.</p><div class="panel"><div class="field"><label for="matrix-domain">Inspect appetite map</label><select id="matrix-domain">${x.categories.map(c=>`<option value="${esc(c.id)}" ${cat?.id===c.id?'selected':''}>${esc(c.label)}</option>`).join('')}</select></div>${matrix(cat)}</div>${x.categories.map((c,i)=>{const p='categories.'+i;return details('category-'+c.id,c.label,`<p>${esc(c.prompt)}</p><div class="grid">${field('Domain name',p+'.label')}${field('Scope review',p+'.coverage',{options:[['unreviewed','Not reviewed'],['relevant','Relevant — model concrete consequences'],['na','Not applicable — explain why']]})}${field('Coverage, exclusions and affected groups',p+'.rationale',{type:'textarea'})}${field('Domain appetite statement',p+'.appetite',{type:'textarea'})}</div>${[0,1,2,3,4].map(j=>`<div class="policy-row"><div class="band">S${j+1}</div>${field('Severity anchor S'+(j+1),p+'.anchors.'+j,{type:'textarea',help:'Use observable harm, duration, reversibility and affected population.'})}${field('Maximum accepted likelihood at S'+(j+1),p+'.limits.'+j,{options:[['','Not configured'],[0,'No acceptance'],[1,'L1 only'],[2,'Up to L2'],[3,'Up to L3'],[4,'Up to L4'],[5,'Up to L5']]})}</div>`).join('')}`,badge(c.coverage==='relevant'?'In scope':c.coverage==='na'?'Excluded':'Not reviewed',c.coverage==='unreviewed'?'review':'unknown'));}).join('')}<div class="actions">${button('Add harm domain','add','category')}</div><section class="panel"><h2>Record the accountable decision</h2><p>${x.decision.recordedAt?'Last recorded: '+esc(x.decision.recordedAt):'Draft decision — no decision checkpoint recorded.'}</p>${(x.decision.needsReview||overdue(x.decision.expires))?notice('The assessment changed or its decision expired. Reassess and record a new decision.','warn'):''}<div class="grid">${field('Decision','decision.choice',{options:['Not decided','Avoid / stop','Reduce / redesign','Defer for evidence','Accept with monitoring','Proceed with conditions','Pursue opportunity within limits']})}${field('Decision maker / authority','decision.authority')}${field('Decision date','decision.date',{type:'date'})}${field('Decision expiry / review date','decision.expires',{type:'date'})}${field('Reasoning, dissent and evidence considered','decision.rationale',{type:'textarea'})}${field('Conditions, owners and stop / escalation criteria','decision.conditions',{type:'textarea'})}</div><div class="actions">${button('Record decision checkpoint','decision-record','','primary')}</div><p class="help">Acceptance records require complete residual comparisons and no structural review gaps. Other decisions can record why work should stop, change or await evidence. This is an editable local record, not a digital signature.</p></section>`;}
function learningPage(){const x=a();return head('06 / Close the learning loop','Learning & reviews','Observe → investigate → change → verify → share → reassess.',button('Add learning record','add','learning','primary'))+`<div class="panel soft"><h2>Learn at three levels</h2><div class="grid three"><div><h3>Improve a control</h3><p class="small">Fix a specific barrier, response or working practice.</p></div><div><h3>Question the model</h3><p class="small">Revisit causal assumptions, scope, thresholds or objectives.</p></div><div><h3>Improve how you learn</h3><p class="small">Change reporting, participation, evidence quality or review governance.</p></div></div></div>${x.learning.map((l,i)=>{const p='learning.'+i;return details('learning-'+l.id,l.observation||l.signal+' · '+l.date,`<div class="grid">${field('Signal type',p+'.signal',{options:['Incident','Near miss','Successful recovery','Routine success','Control test','Changed context','External evidence','Benefit review','Stakeholder feedback']})}${field('Observation date',p+'.date',{type:'date'})}${field('What was observed? Facts and sources','learning.'+i+'.observation',{type:'textarea'})}${field('Linked control',p+'.barrier',{options:[['','Whole system / not one control'],...x.barriers.map(b=>[b.id,b.label])]})}${field('Hypothesis and alternative explanations',p+'.hypothesis',{type:'textarea'})}${field('Learning pathway',p+'.loop',{options:['Improve a control','Question the model','Improve how we learn']})}${field('Action and expected effect',p+'.action',{type:'textarea'})}${field('Accountable action owner',p+'.owner')}${field('Action due date',p+'.due',{type:'date'})}${field('Status',p+'.status',{options:['Open','Investigating','Action in progress','Awaiting verification','Verified & closed','Reopened']})}${field('Verification plan / success measure',p+'.check',{type:'textarea'})}${field('Observed result and verification evidence',p+'.result',{type:'textarea'})}${field('Where will learning be shared or embedded?',p+'.share',{type:'textarea'})}${field('Reopen / reassess trigger',p+'.reopen',{type:'textarea'})}</div><div class="actions">${button('Reassess controls','page','bowtie')}${button('Review appetite and assumptions','page','decision')}${button('Remove learning record','remove',p)}</div>`,badge(l.status+(overdue(l.due)&&l.status!=='Verified & closed'?' · overdue':''),l.status==='Verified & closed'?'within':'review'));}).join('')||'<div class="empty"><h2>Capture evidence, including success</h2><p>A near miss, an unexpected success or a control test can all start a learning loop.</p></div>'}<p class="help">Closure requires an owner, action, verification plan, observed evidence, a sharing route and a reopening trigger. Completion alone is not demonstrated effectiveness. Update the affected controls and estimates explicitly.</p>`;}
const sources=`<ul><li><a href="https://www.caa.co.uk/safety-initiatives/working-with-industry/bowtie/bowtie-elements/" target="_blank" rel="noopener noreferrer">UK CAA: conventional bowtie elements</a> — hazard, top event, threats, consequences, controls and control degradation.</li><li><a href="https://www.gov.uk/government/publications/orange-book/the-orange-book-management-of-risk-principles-and-concepts" target="_blank" rel="noopener noreferrer">HM Treasury: The Orange Book</a> — objectives, opportunity, appetite, accountability and continuing review.</li><li><a href="https://www.hse.gov.uk/simple-health-safety/risk/steps-needed-to-manage-risk.htm" target="_blank" rel="noopener noreferrer">HSE: managing risk</a> — identify exposure, assess harm, control, record and review.</li><li><a href="https://www.w3.org/TR/WCAG22/" target="_blank" rel="noopener noreferrer">W3C: WCAG 2.2</a> — accessibility design reference. This application has not been certified for conformance.</li><li><a href="https://github.com/kriszyp/lmdb-js" target="_blank" rel="noopener noreferrer">lmdb-js: implementation documentation</a> — local transactional persistence and runtime support.</li></ul>`;
function guidePage(){return head('Method / Plain-language reference','A map for disciplined judgement','The conventional bowtie is the core. Opportunity, event-chain and learning views are declared extensions.')+`<section class="panel"><h2>A useful first session</h2><ol><li>Define the objective, scope, affected groups and decision horizon.</li><li>Separate the hazard from one observable top event. Describe actual consequences.</li><li>Build threat and consequence pathways. Link every control to the path it acts on.</li><li>Inspect credible degradation mechanisms, shared dependencies and control evidence.</li><li>Review all harm domains. Define frequency or probability and domain-specific severity anchors.</li><li>Compare inherent, actual residual and target states against appetite, capacity and mandatory constraints. Record who decides and when the decision expires.</li><li>Review incidents, near misses, routine successes and benefit results. Verify changes before closing the learning loop.</li></ol></section><section class="panel"><h2>Terms that should stay distinct</h2><dl class="legend-list"><dt>Hazard</dt><dd>A source or situation with the potential to cause harm.</dd><dt>Threat</dt><dd>A cause that can lead to the loss-of-control event.</dd><dt>Top event</dt><dd>The observable point at which control is lost, before the final harms.</dd><dt>Consequence</dt><dd>A specific outcome affecting people, objectives or other things that matter.</dd><dt>Preventive control</dt><dd>A measure that acts on a threat-to-event path.</dd><dt>Mitigation / recovery</dt><dd>A measure after the top event that reduces consequence likelihood or magnitude, or restores capability.</dd><dt>Escalation factor</dt><dd>A particular mechanism that weakens a control; its protection acts on that mechanism.</dd><dt>Risk appetite</dt><dd>The kind and amount of uncertainty a decision maker is willing to take in pursuing objectives.</dd><dt>Tolerance</dt><dd>Operational limits and triggers that put appetite into practice.</dd><dt>Capacity</dt><dd>The loss or disruption that can actually be absorbed. Willingness cannot create capacity.</dd><dt>Residual risk</dt><dd>The risk remaining with controls as they currently operate. A target is a future estimate.</dd><dt>Confidence</dt><dd>The strength and relevance of the evidence supporting an estimate, separate from event likelihood.</dd></dl></section><section class="panel"><h2>What the comparisons mean</h2><p>Likelihood and severity are ordered labels, not quantities with equal intervals. This tool compares their pair against explicit domain limits; it never multiplies, averages or nets them against benefits. The most restrictive applicable domain governs the comparison.</p><p>Use a scenario for each materially different consequence or affected group. Preserve severe but infrequent outcomes and cumulative harm. Averages can conceal both. Record uncertainty ranges and alternative explanations in their own words and units.</p><p>Frequency counts events per exposure. Probability describes a chance within a stated horizon. Neither the graph nor a coloured cell supplies missing evidence. Unknown estimates, undefined criteria and breached constraints cannot yield a within-appetite result.</p><p>An acceptance comparison is not a legal finding, proof of safety or permission. Mandatory duties and context-specific requirements need their own review.</p></section><section class="panel"><h2>Event-chain reasoning</h2><p>Connect named events with explicit conditions, timing, evidence and confidence. An AND gate needs every declared input; an OR gate needs one sufficient input. State external conditions too. The graph records causal claims; it is not a fault-tree solver or a stochastic simulation.</p><p>Mark feedback as feedback. Separate common-cause dependence from an ordinary sequence. If a consequence starts another hazard scenario, use a linked assessment. Do not assume control independence or multiply protection factors without a justified quantitative model.</p></section><section class="panel"><h2>Reuse without inheriting yesterday’s confidence</h2><p>Drafts autosave. Back up exports every assessment and checkpoint to a versioned JSON file. Import adds assessments as copies. Templates and copies keep structure while clearing decisions, ratings and verification evidence. Review assumptions and names before reuse.</p><p>The browser edition uses IndexedDB. Its data can disappear when browser storage is cleared and does not sync between devices. The local edition stores the same schema in LMDB. Neither edition sends assessment content to third-party services. Database files and exported backups are not encrypted by this application.</p><p>Two windows cannot silently overwrite the same revision: a conflict stops saving and preserves the local edits for export. A checkpoint is useful history, but remains an editable local record rather than a tamper-evident audit trail.</p></section><section class="panel"><h2>Access and cognitive load</h2><p>Use the Reading & access controls for text size, spacing, colour and a single-column layout. Every diagram also has a textual path representation. Native controls work with the keyboard, colour always has a text or symbol equivalent, and no drag, hover, gesture, motion or time limit is required.</p><p>The intended baseline is WCAG 2.2 AA, with additional reading and touch accommodations. Automated checks and keyboard review do not replace testing with disabled users and assistive technology.</p></section><section class="panel"><h2>Sources and design boundaries</h2><p>The harm-domain prompts, editable appetite grid, opportunity extension and learning workflow are a generic design synthesis, not a prescribed universal standard or sector-specific policy. Source guidance was checked in September 2026.</p>${sources}</section>`;}
function printableReport(x){
  const refs=new Map([...chainNodes(x),...x.barriers,...x.categories,...x.opportunities].map(o=>[o.id,o.label]));
  const labels={calibration:'Criteria confirmed',policyDate:'Criteria confirmed on',unit:'Exposure denominator',needsReview:'Decision needs reassessment',likelihood:'Likelihood band',severity:'Severity band',range:'Uncertainty / range',links:'Linked pathways',linkedHarms:'Linked downside consequences',anchors:'Severity anchors S1–S5',limits:'Maximum likelihood by severity S1–S5',obligation:'Mandatory constraint review'};
  const label=k=>labels[k]||k.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,m=>m.toUpperCase());
  const value=v=>v===null?'Unknown':typeof v==='boolean'?(v?'Yes':'No'):typeof v==='string'?(refs.get(v)||v||'Not recorded'):Array.isArray(v)?v.map((z,i)=>typeof z==='object'&&z!==null?`Item ${i+1}: ${Object.entries(z).filter(([k])=>k!=='id').map(([k,q])=>label(k)+': '+value(q)).join('; ')}`:value(z)).join('\n'):Object.entries(v).filter(([k])=>k!=='id').map(([k,q])=>label(k)+': '+value(q)).join('\n');
  const fields=(obj,omit=[])=>`<dl>${Object.entries(obj).filter(([k])=>!['id','history',...omit].includes(k)).map(([k,v])=>`<dt>${esc(label(k))}</dt><dd>${esc(value(v))}</dd>`).join('')}</dl>`;
  const section=(title,items)=>`<h2>${title}</h2>${items.length?items.map(o=>`<article class="report-item"><h3>${esc(o.label||o.observation||o.signal||'Record')}</h3>${fields(o,['label'])}</article>`).join(''):'<p>None recorded.</p>'}`;
  return `<article class="report"><h1>${esc(x.title)}</h1><p>Risk & opportunity assessment · Report generated ${esc(now())}</p><h2>Decision and current comparisons</h2><p><strong>${!x.decision.recordedAt?'Draft — not recorded':x.decision.needsReview||overdue(x.decision.expires)?'Reassessment required':'Recorded local decision'}</strong></p>${fields(x.decision)}${x.consequences.map(c=>{const r=assess(x,c);return `<p><strong>${esc(c.label)}:</strong> ${esc(r.label)}. ${esc(r.reason)}</p>`;}).join('')}<h2>Scope, objectives and criteria</h2>${fields(x,['decision','threats','consequences','barriers','opportunities','categories','events','chainLinks','learning'])}${section('Threats',x.threats)}${section('Controls and degradation protection',x.barriers)}${section('Intermediate events',x.events)}${section('Causal links',x.chainLinks)}${section('Downside consequences and estimates',x.consequences)}${section('Upside opportunities',x.opportunities)}${section('Harm domains and appetite limits',x.categories)}${section('Learning and action records',x.learning)}<h2>Review checklist</h2><ul>${issues(x).map(p=>`<li>${esc(p)}</li>`).join('')||'<li>No structural gaps detected; completeness still needs judgement.</li>'}</ul><h2>Checkpoint index</h2><ul>${x.history.map(h=>`<li>${esc(h.date)} — ${esc(h.note)}</li>`).join('')||'<li>No checkpoints.</li>'}</ul><h2>Method references</h2>${sources}</article>`;
}
function reportPage(){const x=a();return head('07 / Preserve the reasoning','Report & history','Create a review checkpoint, print a complete report, or back up the editable record.',button('Print / save as PDF','print','','primary')+button('Export this assessment','export-one'))+`<section class="panel no-print"><h2>Review checkpoints</h2><div class="grid"><div class="field"><label for="checkpoint-note">What does this checkpoint record?</label><input id="checkpoint-note" value="${esc(historyNote)}" placeholder="For example, review after recovery exercise"></div><div class="actions">${button('Create checkpoint','checkpoint')}</div></div>${x.history.length?`<div class="timeline">${x.history.slice().reverse().map(h=>`<div class="review-row"><div><strong>${esc(h.note)}</strong><p class="small">${esc(new Date(h.date).toLocaleString())}</p></div>${button('Open this version as a copy','restore',h.id)}</div>`).join('')}</div>`:'<p class="help">No checkpoints yet. Autosaving the draft does not create a review checkpoint.</p>'}</section>${printableReport(x)}`;}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function backup(one=false){const w=one?{schemaVersion:SCHEMA,revision:0,assessments:[clone(a())]}:clone(workspace);download(`bowtie-${one?'assessment':'workspace'}-${today()}.json`,JSON.stringify(w,null,2),'application/json');say('Backup exported. Keep the file somewhere you can find again.');}
async function importBackup(file){if(!file)return;if(file.size>5_000_000)throw new Error('Backup is larger than 5 MB. Import a smaller assessment export.');const incoming=validateWorkspace(JSON.parse(await file.text()));if(workspace.assessments.length+incoming.assessments.length>200)throw new Error('This import would exceed 200 assessments.');for(const old of incoming.assessments){const c=clone(old);c.id=uid();c.title+=' · imported';c.decision.needsReview=true;workspace.assessments.push(c);currentId=c.id;}mark();page='home';render(true);say(`Imported ${incoming.assessments.length} assessments as copies.`);}
let undoState=null;
function removeItem(path){undoState=clone(a());const parts=path.split('.'),index=Number(parts.pop()),list=get(a(),parts.join('.')),removed=list[index];list.splice(index,1);if(['threats','consequences','events'].includes(parts[0])){a().chainLinks=a().chainLinks.filter(l=>l.from!==removed.id&&l.to!==removed.id);a().barriers.forEach(b=>b.links=b.links.filter(id=>id!==removed.id));a().opportunities.forEach(o=>o.linkedHarms=o.linkedHarms.filter(id=>id!==removed.id));}if(parts[0]==='barriers'&&parts.length===1)a().learning.forEach(l=>{if(l.barrier===removed.id)l.barrier='';});mark();render();$('alerts').hidden=false;$('alerts').innerHTML=`<div class="notice" role="status">Removed from the draft. ${button('Undo removal','undo')}</div>`;$('alerts').querySelector('button')?.focus();}
function add(type){let entity,list,detail;
  if(type==='threat'){entity=newThreat();list='threats';detail='threat';page='bowtie';}
  if(type==='consequence'){entity=newConsequence();list='consequences';detail='consequence';page='outcomes';}
  if(type==='prevention'||type==='recovery'){entity=newBarrier(type);list='barriers';detail='barrier';page='bowtie';}
  if(type==='event'){entity=newEvent();list='events';detail='event';page='chains';}
  if(type==='link'){entity=newLink();list='chainLinks';detail='link';page='chains';}
  if(type==='opportunity'){entity=newOpportunity();list='opportunities';detail='opportunity';page='outcomes';}
  if(type==='learning'){entity=newLearning();list='learning';detail='learning';page='learning';}
  if(type==='category'){entity={id:uid(),label:'Additional harm domain',prompt:'Describe the harm this domain should make visible.',coverage:'unreviewed',rationale:'',anchors:['','','','',''],limits:[null,null,null,null,null],appetite:''};list='categories';detail='category';page='decision';}
  if(!entity)return;a()[list].push(entity);openDetails.add(detail+'-'+entity.id);mark();render();const d=$(detail+'-'+entity.id);d?.scrollIntoView({block:'start'});d?.querySelector('input,select,textarea')?.focus({preventScroll:true});say('Added '+type+'.');
}
function recordDecision(){const x=a(),d=x.decision;if(!d.authority||!d.date||!d.expires||!d.rationale||d.choice==='Not decided')throw new Error('Record the decision, authority, date, review/expiry date and reasoning.');if(d.date>today()||d.expires<today())throw new Error('Use a decision date no later than today and a current or future review date.');const accepting=['Accept with monitoring','Proceed with conditions','Pursue opportunity within limits'].includes(d.choice);if(accepting&&(!x.consequences.length||issues(x).length||x.consequences.some(c=>assess(x,c).code!=='within')))throw new Error('Acceptance cannot be recorded while residual risks are above appetite, unknown, weakly supported or awaiting review. Resolve the listed gaps or record a stop, redesign or evidence decision.');if(x.history.length>=300)throw new Error('Checkpoint limit reached. Export and start a new review copy.');d.needsReview=false;d.recordedAt=now();x.history.push(snapshot(x,'Decision: '+d.choice));mark('decision.record');render();say('Decision checkpoint recorded.');}
async function action(name,value){if(['new','sample','copy','template','restore'].includes(name)&&workspace.assessments.length>=200)throw new Error('This workspace supports 200 assessments. Back up and archive older work before adding more.');switch(name){
  case 'page':page=value;render(true);break;
  case 'open':currentId=value;page='scope';openDetails.clear();render(true);break;
  case 'new':case 'sample':{const x=name==='new'?newAssessment():sampleAssessment();workspace.assessments.push(x);currentId=x.id;page=name==='new'?'scope':'bowtie';mark();render(true);break;}
  case 'copy':case 'template':{const x=cloneAssessment(workspace.assessments.find(z=>z.id===value),name==='template');workspace.assessments.push(x);currentId=x.id;mark();render();say(name==='template'?'Template created with assurance and decisions reset.':'Copy created; review and verification are required.');break;}
  case 'view':view=value;render();break;
  case 'barrier':{openDetails.add('barrier-'+value);render();const d=$('barrier-'+value);d.open=true;d.scrollIntoView({block:'start'});d.querySelector('summary').focus({preventScroll:true});break;}
  case 'add':add(value);break;
  case 'factor':{const e=newEscalation();a().barriers[Number(value)].escalations.push(e);openDetails.add('factor-'+e.id);mark();render();$('factor-'+e.id)?.querySelector('textarea')?.focus();break;}
  case 'remove':removeItem(value);break;
  case 'undo':if(undoState){const i=workspace.assessments.findIndex(z=>z.id===undoState.id);workspace.assessments[i]=undoState;currentId=undoState.id;undoState=null;$('alerts').hidden=true;mark();render();say('Removal undone.');}break;
  case 'dismiss':$('alerts').hidden=true;break;
  case 'learn-barrier':{const l=newLearning();l.barrier=value;l.signal='Control test';l.observation='Review control: '+a().barriers.find(b=>b.id===value).label;a().learning.push(l);openDetails.add('learning-'+l.id);page='learning';mark();render(true);break;}
  case 'checkpoint':{if(a().history.length>=300)throw new Error('Checkpoint limit reached. Export and start a new review copy.');a().history.push(snapshot(a(),historyNote));historyNote='';mark('decision.checkpoint');render();say('Checkpoint created.');break;}
  case 'decision-record':recordDecision();break;
  case 'restore':{const h=a().history.find(z=>z.id===value);const c=clone(h.data);c.id=uid();c.history=[];c.title+=' · historical copy';c.created=c.updated=now();c.decision.needsReview=true;workspace.assessments.push(c);currentId=c.id;mark();render(true);say('Historical version opened as a new copy. Recheck time-sensitive evidence before use.');break;}
  case 'archive':{const x=workspace.assessments.find(z=>z.id===value);x.archived=!x.archived;mark();render();say(x.archived?'Assessment archived; its data is retained.':'Assessment restored.');break;}
  case 'export-id':{const x=workspace.assessments.find(z=>z.id===value);download('bowtie-archived-'+today()+'.json',JSON.stringify({schemaVersion:SCHEMA,revision:0,assessments:[x]},null,2),'application/json');break;}
  case 'delete-assessment':{const x=workspace.assessments.find(z=>z.id===value);if(!x?.archived)break;if(!window.confirm('Permanently remove this archived assessment and its checkpoints? Keep an exported backup first. This cannot be undone.'))break;workspace.assessments=workspace.assessments.filter(z=>z.id!==value);if(currentId===value)currentId=workspace.assessments[0]?.id||'';mark();render(true);say('Archived assessment removed.');break;}
  case 'export-one':backup(true);break;
  case 'print':window.print();break;
}}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;try{
  if(t.dataset.page){page=t.dataset.page;render(true);return;}
  if(t.dataset.action){await action(t.dataset.action,t.dataset.value);return;}
  if(t.id==='save-now'){const ok=await save();say(ok?'Your changes are saved.':'Saving needs attention; export to preserve edits.');}
  if(t.id==='export-all')backup();
  if(t.id==='access-button'){const p=$('preferences');p.hidden=!p.hidden;t.setAttribute('aria-expanded',String(!p.hidden));if(!p.hidden)renderPreferences();}
}catch(err){alertMessage(err.message);}});
function edit(target){const path=target.dataset.field;if(!path)return;let value=target.type==='checkbox'?target.checked:target.value;
  if(/\.(likelihood|severity)$|\.limits\.\d+$/.test(path))value=value===''?null:Number(value);
  if(/^learning\.\d+\.status$/.test(path)&&value==='Verified & closed'){const l=get(a(),path.split('.').slice(0,-1).join('.'));if(['owner','action','check','result','share','reopen'].some(k=>!l[k].trim())){target.value=l.status;throw new Error('To close a learning record, add an owner, action, verification plan, observed result/evidence, sharing route and reopening trigger.');}l.closed=today();}
  if(get(a(),path)===value)return;put(a(),path,value);
  if(/^(basis|unit|horizon|likelihoodLabels|categories\.\d+\.(anchors|limits))/.test(path))a().calibration=false;
  mark(path);
}
document.addEventListener('input',e=>{try{if(e.target.id==='checkpoint-note'){historyNote=e.target.value;return;}if(e.target.matches('input[type=text],textarea,input[type=date]'))edit(e.target);}catch(err){alertMessage(err.message);}});
document.addEventListener('change',async e=>{const t=e.target;try{
  if(t.dataset.pref){preferences[t.dataset.pref]=t.type==='checkbox'?t.checked:t.value;applyPreferences();if(page==='bowtie')requestAnimationFrame(drawConnectors);return;}
  if(t.id==='assessment-switch'){currentId=t.value;openDetails.clear();render(true);return;}
  if(t.id==='matrix-domain'){matrixCategory=t.value;render();say('Appetite map updated for '+a().categories.find(c=>c.id===matrixCategory).label);return;}
  if(t.id==='import-file'){await importBackup(t.files[0]);return;}
  if(t.dataset.list){const list=get(a(),t.dataset.list);if(t.checked&&!list.includes(t.value))list.push(t.value);else if(!t.checked)put(a(),t.dataset.list,list.filter(x=>x!==t.value));mark(t.dataset.list);render();return;}
  if(t.dataset.field){edit(t);render();const m=t.dataset.field.match(/^consequences\.(\d+)\.residual/);if(m)say('Residual comparison: '+assess(a(),a().consequences[Number(m[1])]).label);}
}catch(err){alertMessage(err.message);}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('resize',()=>{if(page==='bowtie')requestAnimationFrame(drawConnectors);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();});
applyPreferences();renderPreferences();
try{store=await connectStorage();workspace=validateWorkspace(store.initial);currentId=workspace.assessments[0]?.id||'';$('save-status').textContent='Workspace ready';if(workspace.revision===0){dirty=true;await save();}}catch(e){alertMessage(e.message);$('save-status').textContent='Temporary session · export to keep work';}
render();
</script>
</body>
</html>
