# SPDX-License-Identifier: MPL-2.0
name: Workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prototype:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun test tests/prototype.test.mjs
      - run: bash scripts/check-no-placeholders.sh .
      - run: bash scripts/check-root-shape.sh .
  affine-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Configure build paths on the allocated runner
        shell: bash
        run: |
          echo "BOWTIE_BUILD_DIR=$RUNNER_TEMP/bowtie-build" >> "$GITHUB_ENV"
          echo "AFFINESCRIPT_BIN=$RUNNER_TEMP/affinescript/_build/default/bin/main.exe" >> "$GITHUB_ENV"
      - name: Fetch pinned compiler source
        shell: bash
        run: |
          pin=$(bun -e 'console.log(require("./.machine_readable/dependencies.json").dependencies.find(x => x.name === "affinescript").revision)')
          git clone https://github.com/hyperpolymath/affinescript.git "$RUNNER_TEMP/affinescript"
          git -C "$RUNNER_TEMP/affinescript" fetch --depth 1 origin "$pin"
          git -C "$RUNNER_TEMP/affinescript" checkout --detach "$pin"
      - name: Build compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opam ocaml
          opam init --bare --disable-sandboxing --yes
          cd "$RUNNER_TEMP/affinescript"
          opam switch create . ocaml-system --yes
          opam install . --deps-only --yes
          opam exec -- dune build bin/main.exe
      - run: bun scripts/build.mjs
      - run: bun test tests/policy.test.mjs
